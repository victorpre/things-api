[package]
name = "things-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
reqwest = { version = "0.12.25", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-rustls", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "net", "process", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
